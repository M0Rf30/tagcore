[package]
name = "tagcore"
version = "0.1.0"
edition = "2024"
description = "Shared music-tagging core: tag I/O, MusicBrainz, AcoustID, Discogs, matching."
license = "GPL-3.0-or-later"
repository = "https://github.com/M0Rf30/tagcore"

[dependencies]
chromaprint-next = { git = "https://github.com/M0Rf30/chromaprint-next", branch = "improvements/deps-and-review", version = "0.1.0" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff"] }
log = "0.4.35"
playcore = { git = "https://github.com/M0Rf30/playcore", tag = "v0.1.0" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
symphonia = { git = "https://github.com/M0Rf30/Symphonia", branch = "rmpd-next", version = "0.6.1", features = ["all", "dsd"] }
symphonia-core = { git = "https://github.com/M0Rf30/Symphonia", branch = "rmpd-next", version = "0.6.1" }
symphonia-tagging = { git = "https://github.com/M0Rf30/Symphonia", branch = "rmpd-next", version = "0.6.1" }
thiserror = "2.0.21"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
unicode-script = "0.5.9"
